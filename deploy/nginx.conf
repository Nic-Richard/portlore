server {
    server_name portlore.com www.portlore.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    location = /manifest.json { root /var/www/portlore/client/public; expires 1d; add_header Cache-Control "public"; }
    location = /robots.txt    { root /var/www/portlore/client/public; expires 7d; }
    location = /sitemap.xml   { root /var/www/portlore/client/public; expires 1d; }
    location ~* \.(png|ico|svg|webp)$ {
        root /var/www/portlore/client/public;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /cities/ {
        root /var/www/portlore;
        expires 10m;
        add_header Cache-Control "public";
        add_header Content-Type "application/json";
    }

    location = /ports.json {
        root /var/www/portlore/cities;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        root /var/www/portlore/client/src;
        try_files $uri $uri.html /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/portlore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portlore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name portlore.com www.portlore.com;
    return 301 https://portlore.com$request_uri;
}
