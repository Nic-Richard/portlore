name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check
        run: for file in $(git ls-files 'scripts/*.js' 'shared/*.js' 'server/src/**/*.js' 'server/src/*.js'); do node --check "$file"; done

      - name: Shared logic tests
        run: node scripts/smoke-shared.js

      - name: Validate port list and catalogs
        run: node scripts/validate-data.js

      # Generated files must match data/cruise-ports.json.
      - name: Generated port list is up to date
        run: |
          node scripts/build-port-list.js
          git diff --exit-code -- cities/ports.json cities/poi
